<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام | هوشمند</title><link rel="stylesheet" href="assets/hooshmand.css"></head>
<body class="minimal-demo"><main class="auth-shell"><section class="auth-panel"><div class="auth-card">
<div class="brand"><div class="brand-badge">H</div><span class="brand-name">هوشمند</span></div>
<div class="eyebrow">ایجاد حساب</div><h2>ثبت‌نام رایگان</h2><p class="sub">حساب خود را بسازید و از تجربه ورود هوشمند استفاده کنید.</p>
<form data-auth-form><div class="field"><div class="field-head"><label for="reg-name">نام و نام خانوادگی</label></div><input id="reg-name" class="control" type="text" autocomplete="name" placeholder="نام خود را وارد کنید"></div>
<div class="field"><div class="field-head"><label for="reg-email">ایمیل</label></div><input id="reg-email" class="control" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com"></div>
<div class="field"><div class="field-head"><label for="reg-password">رمز عبور</label></div><div class="password-wrap"><input id="reg-password" class="control" type="password" dir="ltr" autocomplete="new-password" placeholder="حداقل ۸ کاراکتر"><button class="toggle-pass" type="button" data-toggle-password="reg-password" aria-label="نمایش رمز عبور" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.4-6 9.8-6 9.8 6 9.8 6-3.4 6-9.8 6-9.8-6-9.8-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div>
<button class="primary" type="submit">ایجاد حساب</button><p class="hidden" data-form-note style="font-size:12px;color:#7c756d;line-height:1.9;margin:12px 0 0"></p></form>
<div class="foot-link">قبلاً حساب ساخته‌اید؟ <a href="login.html">ورود به حساب</a></div>
</div></section></main><script src="assets/auth.js"></script></body></html>
