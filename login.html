<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | هوشمند — دمو کلاسیک</title><link rel="stylesheet" href="assets/hooshmand.css"></head><body><main class="auth-shell"><section class="auth-art"><div class="art-grid"></div><div class="art-copy"><div class="art-mark">H</div><h1>ورود ساده، تجربه‌ای مطمئن.</h1><p>یک الگوی ورود تمیز و حرفه‌ای برای محصولات فارسی؛ با تمرکز روی خوانایی، فاصله‌گذاری دقیق و تجربه مناسب موبایل.</p><div class="art-note">دمو ۱ · کلاسیک / سازمانی</div></div></section><section class="auth-panel"><div class="auth-card"><div class="brand"><div class="brand-badge">H</div><span class="brand-name" data-brand>هوشمند</span></div><div class="eyebrow">حساب کاربری</div><h2>خوش آمدید</h2><p class="sub">برای ادامه وارد حساب خود شوید.</p><form data-auth-form><div class="field"><div class="field-head"><label for="email">ایمیل یا نام کاربری</label></div><input id="email" class="control" type="text" dir="ltr" placeholder="mail@example.com" autocomplete="username"></div><div class="field"><div class="field-head"><label for="password">رمز عبور</label><a href="forgot-password.html">بازیابی رمز</a></div><div class="password-wrap"><input id="password" class="control" type="password" dir="ltr" placeholder="••••••••" autocomplete="current-password"><button class="toggle-pass" type="button" data-toggle-password="password" aria-label="نمایش رمز عبور" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.4-6 9.8-6 9.8 6 9.8 6-3.4 6-9.8 6-9.8-6-9.8-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div class="check-row"><label class="check"><input type="checkbox"> مرا به خاطر بسپار</label><span>ورود امن</span></div><button class="primary" type="submit">ورود به حساب</button><p class="hidden" data-form-note style="font-size:12px;color:#687581;line-height:1.9;margin:12px 0 0"></p></form><div class="divider">یا ورود با</div><div class="socials"><button class="social" data-social-demo type="button"><svg viewBox="0 0 18 18"><path d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.3h2.9c1.7-1.6 2.7-3.9 2.7-6.6z" fill="#4285F4"/><path d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z" fill="#34A853"/><path d="M4 10.7A5.4 5.4 0 0 1 3.7 9c0-.6.1-1.2.3-1.7V5H1a9 9 0 0 0 0 8.1l3-2.4z" fill="#FBBC05"/><path d="M9 3.6c1.3 0 2.5.5 3.4 1.4L15 2.4C13.5.9 11.4 0 9 0A9 9 0 0 0 1 5l3 2.3c.7-2.1 2.7-3.7 5-3.7z" fill="#EA4335"/></svg>ورود با گوگل</button><button class="social" data-social-demo type="button"><svg viewBox="0 0 24 24"><path d="M16.4 21.4c-1.4 0-2.8-.9-4.2-.9-1.4 0-2.9.9-4.2.9s-2.6-.5-3.6-1.3C2.4 18.6 1 15.9 1 13.3c0-3.4 2.4-5.8 5.2-5.8 1.4 0 2.7.7 3.8.7 1.1 0 2.3-.8 3.9-.8 2.6 0 4.6 1.9 5.3 4.2-2.5 1.1-3 4-.9 5.7-.5 1.1-1.3 2.2-2 3.1z"/></svg>ورود با اپل</button></div><div class="foot-link">حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a></div></div></section></main><script src="assets/auth.js"></script></body></html>
