<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود اجتماعی | هوشمند</title><link rel="stylesheet" href="admin.css"></head><body><div class="layout"><aside class="side"><div class="brand-admin"><b>H</b><span>پنل مدیریت هوشمند</span></div><nav class="nav"><a href="index.html">داشبورد</a><a href="brand.html">برند و لوگو</a><a href="fields.html">فیلدهای ورود</a><a class="active" href="social.html">ورود اجتماعی</a></nav></aside><section class="main"><header class="top"><h1>ورود اجتماعی</h1><small>فعال‌سازی روش‌های ورود</small></header><main class="content"><div class="form-card"><div class="form-row"><div><label>Google</label><p>نمایش دکمه ورود با حساب گوگل</p></div><button class="toggle" id="google" onclick="flip('google')"></button></div><div class="form-row"><div><label>Apple</label><p>نمایش دکمه ورود با حساب اپل</p></div><button class="toggle" id="apple" onclick="flip('apple')"></button></div><div class="form-row"><div><label>Facebook</label><p>نمایش گزینه ورود با فیسبوک</p></div><button class="toggle" id="facebook" onclick="flip('facebook')"></button></div></div><button class="save" onclick="saveSocial()">ذخیره تغییرات</button><div class="notice">تنظیمات ورود اجتماعی ذخیره شد.</div></main></section></div><script>const s=JSON.parse(localStorage.getItem('hooshmand_settings')||'{}');s.social=s.social||{google:true,apple:true,facebook:false};function paint(){Object.keys(s.social).forEach(k=>document.getElementById(k).classList.toggle('on',!!s.social[k]))}function flip(k){s.social[k]=!s.social[k];paint()}function saveSocial(){localStorage.setItem('hooshmand_settings',JSON.stringify(s));document.querySelector('.notice').style.display='block';setTimeout(()=>document.querySelector('.notice').style.display='none',2000)}paint();</script></body></html>
