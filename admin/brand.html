<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برند و لوگو | هوشمند</title><link rel="stylesheet" href="admin.css"></head><body><div class="layout"><aside class="side"><div class="brand-admin"><b>H</b><span>پنل مدیریت هوشمند</span></div><nav class="nav"><a href="index.html">داشبورد</a><a class="active" href="brand.html">برند و لوگو</a><a href="fields.html">فیلدهای ورود</a><a href="social.html">ورود اجتماعی</a></nav></aside><section class="main"><header class="top"><h1>برند و لوگو</h1><small>هویت بصری صفحه ورود</small></header><main class="content"><div class="form-card"><div class="field-block"><label for="brand">نام برند</label><input id="brand" class="input" value="هوشمند"></div><div class="field-block"><label for="logo">آدرس لوگو</label><input id="logo" class="input" placeholder="assets/logo.svg"><p class="muted">برای پروژه HTML می‌توانید مسیر یک فایل SVG یا PNG داخل پوشه assets را وارد کنید.</p></div></div><button class="save" onclick="saveBrand()">ذخیره تغییرات</button><div class="notice">تنظیمات با موفقیت ذخیره شد.</div></main></section></div><script>function saveBrand(){const s=JSON.parse(localStorage.getItem('hooshmand_settings')||'{}');s.brandName=document.getElementById('brand').value.trim()||'هوشمند';s.logo=document.getElementById('logo').value.trim();localStorage.setItem('hooshmand_settings',JSON.stringify(s));document.querySelector('.notice').style.display='block';setTimeout(()=>document.querySelector('.notice').style.display='none',2000)}const s=JSON.parse(localStorage.getItem('hooshmand_settings')||'{}');document.getElementById('brand').value=s.brandName||'هوشمند';document.getElementById('logo').value=s.logo||'';</script></body></html>
