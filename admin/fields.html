<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فیلدهای ورود | هوشمند</title><link rel="stylesheet" href="admin.css"></head><body><div class="layout"><aside class="side"><div class="brand-admin"><b>H</b><span>پنل مدیریت هوشمند</span></div><nav class="nav"><a href="index.html">داشبورد</a><a href="brand.html">برند و لوگو</a><a class="active" href="fields.html">فیلدهای ورود</a><a href="social.html">ورود اجتماعی</a></nav></aside><section class="main"><header class="top"><h1>فیلدهای ورود</h1><small>کنترل عناصر فرم</small></header><main class="content"><div class="form-card"><div class="form-row"><div><label>ایمیل</label><p>فیلد اصلی شناسایی کاربر</p></div><button class="toggle" id="email" onclick="flip('email')"></button></div><div class="form-row"><div><label>شماره تلفن</label><p>برای سناریوهای ورود با شماره موبایل</p></div><button class="toggle" id="phone" onclick="flip('phone')"></button></div><div class="form-row"><div><label>رمز عبور</label><p>فیلد ورود رمز و امکان نمایش/مخفی‌سازی</p></div><button class="toggle" id="password" onclick="flip('password')"></button></div></div><button class="save" onclick="saveFields()">ذخیره تغییرات</button><div class="notice">تنظیمات فیلدها ذخیره شد.</div></main></section></div><script>const s=JSON.parse(localStorage.getItem('hooshmand_settings')||'{}');s.fields=s.fields||{email:true,phone:false,password:true};function paint(){Object.keys(s.fields).forEach(k=>document.getElementById(k).classList.toggle('on',!!s.fields[k]))}function flip(k){s.fields[k]=!s.fields[k];paint()}function saveFields(){localStorage.setItem('hooshmand_settings',JSON.stringify(s));document.querySelector('.notice').style.display='block';setTimeout(()=>document.querySelector('.notice').style.display='none',2000)}paint();</script></body></html>
